name: Refresh daily portfolio history

on:
  schedule:
    # After 18:00 New York in both winter and summer. Off the busy hour boundary.
    - cron: '37 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run history:update
      - run: npm test
      - name: Save complete daily snapshot
        run: |
          if git diff --quiet -- public/data/market-history.json; then
            echo "History is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/market-history.json
          git commit -m "data: update portfolio daily closes"
          git push origin HEAD:main
